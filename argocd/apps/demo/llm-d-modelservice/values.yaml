# llm-d-modelservice v0.5.2. Single A10 decode replica for the
# optimized-baseline pool. Qwen2.5-1.5B fp16 at 4096 tokens fits 24GiB.
# np1 is the only GPU pool (VM.GPU.A10.1); the gpu-operator label and
# taint place the pod there. Gateway mode: no routing sidecar.
fullnameOverride: modelservice
modelArtifacts:
  # Served name, not the Hugging Face repo. The chart passes this as
  # --served-model-name, which is the vLLM model_name metric label.
  # It must match the pod label llm-d.ai/model exactly.
  name: qwen2.5-1.5b-instruct
  uri: hf://Qwen/Qwen2.5-1.5B-Instruct
  size: 10Gi
  mountPath: /cache
  labels:
    app: modelservice
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: optimized-baseline
    llm-d.ai/model: qwen2.5-1.5b-instruct
routing:
  servicePort: 8000
  proxy:
    enabled: false
prefill:
  create: false
encode:
  create: false
decode:
  create: true
  replicas: 1
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 75
  nodeSelector:
    nvidia.com/gpu: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  podSecurityContext:
    fsGroup: 1000
  parallelism:
    tensor: 1
    data: 1
    dataLocal: 1
    workers: 1
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: modelserver
      image: docker.io/vllm/vllm-openai:v0.31.0
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      mountModelVolume: true
      args:
        - --served-model-name=qwen2.5-1.5b-instruct
        - --max-num-seqs=16
        - --max-model-len=4096
        - --gpu-memory-utilization=0.90
        - --dtype=half
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --shutdown-timeout=45
      env:
        - name: HOME
          value: /cache
        - name: XDG_CACHE_HOME
          value: /cache/xdg
        - name: VLLM_CACHE_ROOT
          value: /cache/vllm
        # Driver on the A10 node is 580.82.07. Skip the image require-list
        # so a newer host driver is accepted.
        - name: NVIDIA_DISABLE_REQUIRE
          value: "true"
      ports:
        - name: modelserver
          containerPort: 8000
          protocol: TCP
      resources:
        requests:
          cpu: 4000m
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: 8000m
          memory: 24Gi
          nvidia.com/gpu: "1"
      startupProbe:
        httpGet:
          path: /v1/models
          port: modelserver
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 90
      readinessProbe:
        httpGet:
          path: /v1/models
          port: modelserver
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: modelserver
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
      extraConfig:
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "15"]
