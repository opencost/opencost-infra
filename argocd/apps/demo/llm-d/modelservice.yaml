apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelservice
  namespace: vllm-inference
automountServiceAccountToken: false
---
# Single A10 decode replica. Qwen2.5-1.5B fp16 at 4096 tokens fits 24GiB.
# Pod labels match the llm-d InferencePool selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelservice
  namespace: vllm-inference
  labels:
    app: modelservice
    llm-d.ai/role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelservice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: modelservice
        llm-d.ai/role: decode
        llm-d.ai/guide: optimized-baseline
        llm-d.ai/model: qwen2.5-1.5b-instruct
    spec:
      serviceAccountName: modelservice
      terminationGracePeriodSeconds: 75
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 1000
      containers:
        - name: modelserver
          image: docker.io/vllm/vllm-openai:v0.31.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen2.5-1.5B-Instruct
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90
            - --dtype=half
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            - --shutdown-timeout=45
          env:
            - name: HOME
              value: /cache
            - name: HF_HOME
              value: /cache/huggingface
            - name: HF_HUB_CACHE
              value: /cache/huggingface/hub
            - name: XDG_CACHE_HOME
              value: /cache/xdg
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            # Driver on the A10 node is 580.82.07. Skip the image require-list
            # so a newer host driver is accepted.
            - name: NVIDIA_DISABLE_REQUIRE
              value: "true"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 4000m
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: 8000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /cache
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: cache
          emptyDir: {}
