# In-cluster Gateway for the llm-d router HTTPRoute. agentgateway's
# default Service is a LoadBalancer; ClusterIP keeps the A10 endpoint
# off the public OCI load balancer. The generated Service name matches
# the Gateway name (port 80).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm-d-inference-gateway
  namespace: vllm-inference
spec:
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    tag: v1.5.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-inference-gateway
  namespace: vllm-inference
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: llm-d-inference-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
