apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: modelservice
  namespace: vllm-inference
  labels:
    app: modelservice
    # podMonitorSelectorNilUsesHelmValues stays at the chart default, so
    # Prometheus only selects PodMonitors labeled for this Helm release.
    release: prometheus
spec:
  selector:
    matchLabels:
      app: modelservice
  podMetricsEndpoints:
    - port: modelserver
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_uid]
          targetLabel: pod_uid
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
          action: replace
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
          action: replace
