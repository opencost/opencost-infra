apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: llm-d-gateway
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/opencost/opencost-infra.git
      revision: main
      files:
      - path: "argocd/apps/*/llm-d-gateway/values.yaml"
  template:
    metadata:
      name: 'llm-d-gateway-{{ index .path.segments 2 }}'
      labels:
        debug.argocd.argoproj.io/stage: '{{ index .path.segments 2 }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      sources:
        - repoURL: oci://cr.agentgateway.dev/charts/agentgateway-crds
          chart: agentgateway-crds
          targetRevision: v1.5.0
          helm:
            releaseName: agentgateway-crds
        - repoURL: oci://cr.agentgateway.dev/charts/agentgateway
          chart: agentgateway
          targetRevision: v1.5.0
          helm:
            releaseName: agentgateway
            valueFiles:
            - '$values/argocd/apps/{{ index .path.segments 2 }}/llm-d-gateway/values.yaml'
        - repoURL: https://github.com/opencost/opencost-infra.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: vllm-inference
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
