apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: llm-d-modelservice
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/opencost/opencost-infra.git
      revision: main
      files:
      - path: "argocd/apps/*/llm-d-modelservice/values.yaml"
  template:
    metadata:
      name: 'llm-d-modelservice-{{ index .path.segments 2 }}'
      labels:
        debug.argocd.argoproj.io/stage: '{{ index .path.segments 2 }}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      sources:
        - repoURL: https://llm-d-incubation.github.io/llm-d-modelservice
          chart: llm-d-modelservice
          targetRevision: v0.5.2
          helm:
            releaseName: modelservice
            valueFiles:
            - '$values/argocd/apps/{{ index .path.segments 2 }}/llm-d-modelservice/values.yaml'
        - repoURL: https://github.com/opencost/opencost-infra.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: vllm-inference
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
